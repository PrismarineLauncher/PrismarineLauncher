[package]
name = "prismarine_launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.33", default-features = true }
egui = "0.33"
egui_commonmark = "0.22"
image = "0.25"
qrcode = "0.14"
rfd = "0.15"
rust_core = { path = "./core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
