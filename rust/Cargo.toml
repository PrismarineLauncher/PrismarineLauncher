[package]
name = "prismarine_launcher"
version = "1.0.31"
edition = "2024"

[dependencies]
anyhow = "1"
arboard = "3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.33", default-features = true }
egui = "0.33"
egui_commonmark = { version = "0.22", features = ["fetch"] }
image = { version = "0.25", default-features = true, features = ["webp"] }
qrcode = "0.14"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
resvg = "0.44"
rust_core = { path = "./core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
