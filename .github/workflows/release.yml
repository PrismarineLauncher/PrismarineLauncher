name: Build Application and Make Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-slim
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "true"
          path: "PrismarineLauncher-source"
      - name: Download artifacts
        uses: actions/download-artifact@v7
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package artifacts properly
        run: |
          mv ${{ github.workspace }}/PrismarineLauncher-source PrismarineLauncher-${{ env.VERSION }}
          mv PrismarineLauncher-Linux-Qt6-Portable*/PrismarineLauncher-portable.tar.gz PrismarineLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv PrismarineLauncher-Linux-aarch64-Qt6-Portable*/PrismarineLauncher-portable.tar.gz PrismarineLauncher-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv PrismarineLauncher-*.AppImage/PrismarineLauncher-*-x86_64.AppImage PrismarineLauncher-Linux-x86_64.AppImage
          mv PrismarineLauncher-*.AppImage.zsync/PrismarineLauncher-*-x86_64.AppImage.zsync PrismarineLauncher-Linux-x86_64.AppImage.zsync
          mv PrismarineLauncher-*.AppImage/PrismarineLauncher-*-aarch64.AppImage PrismarineLauncher-Linux-aarch64.AppImage
          mv PrismarineLauncher-*.AppImage.zsync/PrismarineLauncher-*-aarch64.AppImage.zsync PrismarineLauncher-Linux-aarch64.AppImage.zsync
          mv PrismarineLauncher-macOS*/PrismarineLauncher.zip PrismarineLauncher-macOS-${{ env.VERSION }}.zip

          tar --exclude='.git' -czf PrismarineLauncher-${{ env.VERSION }}.tar.gz PrismarineLauncher-${{ env.VERSION }}

          for d in PrismarineLauncher-Windows-MSVC*; do
            cd "${d}" || continue
            LEGACY="$(echo -n ${d} | grep -o Legacy || true)"
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="PrismarineLauncher-Windows-MSVC"
            test -z "${LEGACY}" || NAME="${NAME}-Legacy"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv PrismarineLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in PrismarineLauncher-Windows-MinGW-w64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="PrismarineLauncher-Windows-MinGW-w64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv PrismarineLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in PrismarineLauncher-Windows-MinGW-arm64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="PrismarineLauncher-Windows-MinGW-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv PrismarineLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: Prismarine Launcher ${{ env.VERSION }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            PrismarineLauncher-Linux-x86_64.AppImage
            PrismarineLauncher-Linux-x86_64.AppImage.zsync
            PrismarineLauncher-Linux-aarch64.AppImage
            PrismarineLauncher-Linux-aarch64.AppImage.zsync
            PrismarineLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
            PrismarineLauncher-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
            PrismarineLauncher-Windows-MinGW-w64-${{ env.VERSION }}.zip
            PrismarineLauncher-Windows-MinGW-w64-Portable-${{ env.VERSION }}.zip
            PrismarineLauncher-Windows-MinGW-w64-Setup-${{ env.VERSION }}.exe
            PrismarineLauncher-Windows-MinGW-arm64-${{ env.VERSION }}.zip
            PrismarineLauncher-Windows-MinGW-arm64-Portable-${{ env.VERSION }}.zip
            PrismarineLauncher-Windows-MinGW-arm64-Setup-${{ env.VERSION }}.exe
            PrismarineLauncher-Windows-MSVC-arm64-${{ env.VERSION }}.zip
            PrismarineLauncher-Windows-MSVC-arm64-Portable-${{ env.VERSION }}.zip
            PrismarineLauncher-Windows-MSVC-arm64-Setup-${{ env.VERSION }}.exe
            PrismarineLauncher-Windows-MSVC-${{ env.VERSION }}.zip
            PrismarineLauncher-Windows-MSVC-Portable-${{ env.VERSION }}.zip
            PrismarineLauncher-Windows-MSVC-Setup-${{ env.VERSION }}.exe
            PrismarineLauncher-macOS-${{ env.VERSION }}.zip
            PrismarineLauncher-${{ env.VERSION }}.tar.gz
