name: Windows Build

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: Build type
        type: choice
        options:
          - Debug
          - Release
        default: Release
      toolchain:
        description: Toolchain to build
        type: choice
        options:
          - msvc
          - mingw
          - both
        default: msvc
      run-tests:
        description: Run ctest after build
        type: boolean
        default: true

permissions: {}

jobs:
  build:
    name: Windows (${{ matrix.artifact-name }}, ${{ inputs.build-type }})
    if: ${{ inputs.toolchain == 'both' || inputs.toolchain == matrix.id }}

    runs-on: windows-2022

    permissions:
      contents: read
      id-token: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: msvc
            artifact-name: Windows-MSVC
            cmake-preset: windows_msvc
            msystem: ""
            vcvars-arch: amd64
            qt-version: 6.10.2

          - id: mingw
            artifact-name: Windows-MinGW-w64
            cmake-preset: windows_mingw
            msystem: CLANG64
            vcvars-arch: amd64_x86
            qt-version: 6.10.2

    defaults:
      run:
        shell: ${{ matrix.msystem != '' && 'msys2 {0}' || 'bash' }}

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: ${{ inputs.build-type }}
      CMAKE_PRESET: ${{ matrix.cmake-preset }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ matrix.qt-version }}

      - name: Configure project
        run: |
          cmake --preset "$CMAKE_PRESET"

      - name: Build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Run tests
        if: ${{ inputs.run-tests }}
        run: |
          ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE" --extra-verbose --output-on-failure

      - name: Get short version
        id: short-version
        shell: bash
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        uses: ./.github/actions/package/windows
        env:
          CI_HAS_ACCESS_TO_AZURE: ${{ vars.CI_HAS_ACCESS_TO_AZURE || '' }}
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}

          azure-client-id: ${{ secrets.AZURE_CLIENT_ID || '' }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID || '' }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || '' }}
